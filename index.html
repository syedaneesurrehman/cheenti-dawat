<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Cheenti Dawat</title>
  <meta name="description" content="Ant Feast — a pixel food puzzle with Pakistani dishes.">
  <meta name="theme-color" content="#24160e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cheenti Dawat">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ant" viewBox="0 0 32 32">
      <g fill="currentColor" stroke="currentColor" stroke-linecap="round">
        <ellipse cx="16" cy="22.5" rx="5.2" ry="6.5" stroke="none"/>
        <ellipse cx="16" cy="13.5" rx="3.2" ry="3.4" stroke="none"/>
        <circle cx="16" cy="7.2" r="3.6" stroke="none"/>
        <path d="M13 12 L6 9 M13 14 L5 15 M13 16 L6 21 M19 12 L26 9 M19 14 L27 15 M19 16 L26 21 M14.5 4.5 L11 1 M17.5 4.5 L21 1" stroke-width="1.8" fill="none"/>
      </g>
    </symbol>
  </svg>

  <div id="app">
    <section id="home" class="screen">
      <div class="home-top">
        <h1 class="logo"><span class="ur">چیونٹی کی دعوت</span><span class="en">Cheenti Dawat</span></h1>
        <p class="tag">Ant Feast · a pixel food puzzle</p>
      </div>
      <canvas id="homeArt" aria-hidden="true"></canvas>
      <div class="home-actions">
        <button id="playBtn" class="btn primary big">Khelo! <small id="playLvl"></small></button>
        <button id="levelsBtn" class="btn">All levels</button>
        <button id="howBtn" class="btn ghost">How to play</button>
      </div>
      <div class="home-foot">
        <span class="coins">🪙 <b class="coinCount">0</b></span>
        <button class="btn icon soundBtn" aria-label="Toggle sound">🔊</button>
      </div>
    </section>

    <section id="levels" class="screen" hidden>
      <header class="bar">
        <button class="btn icon" data-go="home" aria-label="Back">‹</button>
        <h2>Dastarkhwan</h2>
        <span class="coins">🪙 <b class="coinCount">0</b></span>
      </header>
      <div id="levelGrid"></div>
    </section>

    <section id="game" class="screen" hidden>
      <header class="bar">
        <button class="btn icon" id="backBtn" aria-label="Levels">‹</button>
        <div class="title">
          <div id="lvlName"></div>
          <div id="lvlSub"></div>
        </div>
        <span class="coins">🪙 <b class="coinCount">0</b></span>
        <button class="btn icon soundBtn" aria-label="Toggle sound">🔊</button>
      </header>
      <div id="boardWrap"><canvas id="board"></canvas><div id="toast"></div></div>
      <div id="thaalRow">
        <div class="label">Thaal</div>
        <div id="thaal"></div>
      </div>
      <div id="lanes"></div>
      <div id="boosters">
        <button class="booster" data-boost="hint"><span>💡</span>Hint <b>25</b></button>
        <button class="booster" data-boost="undo"><span>↩️</span>Undo <b>40</b></button>
        <button class="booster" data-boost="slot"><span>➕</span>Slot <b>60</b></button>
        <button class="booster" data-boost="retry"><span>🔁</span>Retry</button>
      </div>
    </section>

    <div id="modal" hidden><div class="card"></div></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
